name: Build (macOS + Windows)

# Ne zaman çalışır:
#   - "v1.0.0" gibi bir SÜRÜM ETİKETİ push'unda -> derler VE GitHub Releases'e otomatik yükler
#     (yayinla.py / guncelle_ve_yayinla.command her yayında otomatik etiket oluşturup gönderir)
#   - Actions sekmesinden manuel de tetiklenebilir (workflow_dispatch)
# NOT: Sıradan "main" push'larında ARTIK derleme YAPILMAZ — bu, macOS runner
#      kuyruğunu gereksiz yere iki katına çıkarmamak içindir. Her yayın zaten
#      otomatik olarak bir sürüm etiketi aldığı için tek bir derleme döngüsü yeterli.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch: {}

# GITHUB_TOKEN'a Release olusturma/yukleme izni ver (varsayilan read-only'dir).
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_name: Windows
            add_data_sep: ';'
          - os: macos-latest
            platform_name: macOS
            add_data_sep: ':'
    runs-on: ${{ matrix.os }}

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Derle (PyInstaller)
        # NOT: ProfiDO_IM.png depoya kasitli olarak eklenmedi (kisisel/is
        # fotografi). Bundan dolayi GitHub derlemesinde bu dosya paketlenmez;
        # kod zaten dosya yoksa otomatik olarak yedek logo ciziminie
        # duser (splash_screen.py -> _draw_hex_logo). Yerel derlemede
        # (mac_derle.command / build_exe.bat) dosya mevcut oldugundan
        # orada gercek fotograf kullanilir.
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name "KSB_ProfilKesim"
          --add-data "ui${{ matrix.add_data_sep }}ui"
          --add-data "yilmaz_logo.png${{ matrix.add_data_sep }}."
          main.py

      - name: Derleme çıktısını yükle
        uses: actions/upload-artifact@v4
        with:
          name: KSB_ProfilKesim-${{ matrix.platform_name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release oluştur (sadece tag push'unda)
    needs: build
    # NOT: "always()" — matrix'teki bir platform (orn. macOS runner kuyrugu)
    # basarisiz/timeout olsa bile bu adim ATLANMAZ. Boylece en azindan
    # basarili olan platformun (orn. Windows) dosyasi Release'e eklenir.
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Derleme çıktılarını indir (mevcut olanları)
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true

      - name: Çıktıları tek dosya halinde zip'le (sadece mevcut olanlar)
        # macOS .app bir klasördür; zip'lenmeden paylaşılırsa izinler/iç yapı
        # bozulabilir. Windows tarafı da tutarlılık için aynı şekilde zip'lenir.
        run: |
          if [ -d "artifacts/KSB_ProfilKesim-Windows" ]; then
            (cd artifacts/KSB_ProfilKesim-Windows && zip -r ../../KSB_ProfilKesim-Windows.zip .)
          else
            echo "Windows ciktisi bu calismada yok, atlaniyor."
          fi
          if [ -d "artifacts/KSB_ProfilKesim-macOS" ]; then
            (cd artifacts/KSB_ProfilKesim-macOS && zip -ry ../../KSB_ProfilKesim-macOS.zip .)
          else
            echo "macOS ciktisi bu calismada yok, atlaniyor."
          fi

      - name: Release oluştur / güncelle
        uses: softprops/action-gh-release@v2
        with:
          files: KSB_ProfilKesim-*.zip
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: false
